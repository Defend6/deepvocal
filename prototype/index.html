<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepVocal 交互原型</title><style>
:root{--ink:#182a39;--muted:#5b6c78;--teal:#086f70;--line:#dce5e9;--bg:#f3f6f8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.65 'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e3a526;outline-offset:3px}header{height:78px;padding:16px 30px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}header strong{font-size:24px}header small{display:block;color:var(--muted)}.flag{background:#fff4d6;color:#76540c;padding:7px 12px;border-radius:6px;font-size:13px}.layout{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:calc(100vh - 78px)}nav{padding:28px 18px;background:white;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;padding:12px 16px;border:0;border-radius:6px;background:none;color:var(--muted);margin-bottom:6px}nav button.active{background:#e6f3f1;color:var(--teal);font-weight:bold}nav p{font-size:12px;padding:14px;color:var(--muted)}main{padding:32px 40px;max-width:1280px;width:100%}h1{font-size:28px;line-height:1.35;margin:0 0 10px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{margin:0 0 15px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);padding:24px;border-radius:10px;margin-bottom:20px;min-width:0}.grid .card{margin:0}.primary{background:var(--teal);border:1px solid var(--teal);color:white;padding:10px 18px;border-radius:6px}.secondary{background:white;border:1px solid #b8cbd3;color:var(--ink);padding:9px 16px;border-radius:6px}.danger{border-color:#c84646;color:#a52e2e}.pill{display:inline-block;border-radius:4px;background:#e8f3f2;color:var(--teal);font-size:12px;padding:3px 8px}.notice{border-left:3px solid #d29f36;background:#fff9eb;padding:12px 16px;margin:16px 0;color:#6a5017}label{display:block;font-weight:600;margin:12px 0 5px}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #b8cbd3;background:white;border-radius:5px;padding:10px;color:var(--ink)}textarea{min-height:88px;resize:vertical}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spaced{justify-content:space-between}.kpi{font-size:25px;font-weight:700;display:block}table{border-collapse:collapse;width:100%;margin-top:10px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f7fafb;font-weight:600}.steps{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.step{padding:7px 12px;border:1px solid var(--line);border-radius:5px;background:white;font-size:13px}details{border:1px solid var(--line);padding:12px;margin-top:12px;border-radius:6px}summary{cursor:pointer;font-weight:600}#notice{position:fixed;bottom:18px;left:240px;right:28px;padding:12px 18px;background:#182a39;color:white;border-radius:7px;box-shadow:0 4px 16px #0002;z-index:5}#notice:empty{display:none}.inline-label{display:flex;align-items:flex-start;gap:10px;font-weight:400}.inline-label input{margin-top:7px}.task{border-top:1px solid var(--line);padding:14px 0}.task:first-child{border-top:0}a{color:var(--teal)}.callout{font-size:13px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}nav{display:flex;gap:5px;overflow-x:auto;padding:10px}nav button{width:auto;white-space:nowrap;margin:0}nav p{display:none}main{padding:22px 18px}.grid,.three{grid-template-columns:1fr}header{height:auto;padding:14px 18px;gap:16px}header strong{font-size:20px}#notice{left:18px;right:18px}.card{padding:18px}table{font-size:13px}}
</style></head><body><header><div><strong>DeepVocal 声乐导师</strong><small>LangGraph 多 Agent 声乐学习助手</small></div><div class="flag">文档原型 · 演示数据 · 不上传声音</div></header><div class="layout"><nav aria-label="主导航" id="nav"></nav><main id="main"></main></div><div id="notice" role="status" aria-live="polite"></div><script>
const pages=[['home','学习概览'],['chat','声乐问答'],['assessment','录音测评'],['plan','练习计划'],['singing','歌声服务接入'],['history','曲目与历史'],['memory','记忆与隐私'],['admin','管理台']];
const state={page:'home',report:false,plan:false,checked:new Set(),consent:false,consentFile:null,generated:false,melody:null,assessmentFile:null,job:'',memory:'candidate',memoryMinutes:15,deleted:false,review:'candidate',answer:false};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let noticeTimer;function notify(t){clearTimeout(noticeTimer);document.getElementById('notice').textContent=t;noticeTimer=setTimeout(()=>document.getElementById('notice').textContent='',6000)}
function go(p){state.page=p;document.getElementById('notice').textContent='';render()}
function intro(t,d){const agents={chat:'Vocal Knowledge Agent',assessment:'Song Assessment Agent',plan:'Practice Planning Agent',singing:'AI Singing Agent'};return `<h1>${t}</h1><p class="muted">${d}</p>${agents[state.page]?`<p><span class="pill">由 ${agents[state.page]} 处理 · LangGraph 统一编排</span></p>`:''}`}
function btn(t,code,primary=true){return `<button class="${primary?'primary':'secondary'}" onclick="${code}">${t}</button>`}
function header(){document.getElementById('nav').innerHTML=pages.map(([p,t])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')" ${state.page===p?'aria-current="page"':''}>${t}</button>`).join('')+'<p>V1.4 设计评审版<br>刷新页面会重置演示状态<br><a href="../index.html">查看项目文档</a></p>'}
function render(){header();const main=document.getElementById('main');let s='';
if(state.page==='home')s=intro('今天从哪一步开始','LangGraph 统一编排四类专业 Agent，通过结构化规则与意图分类选择任务和工具。')+`<div class="grid three"><div class="card"><span class="muted">本次演示报告</span><span class="kpi">${state.report?'1':'0'} 份</span><p class="callout">来自原型流程，不是算法结果</p></div><div class="card"><span class="muted">当前练习计划</span><span class="kpi">${state.plan?'7 天':'尚未建立'}</span><p class="callout">按每日 15 分钟安排</p></div><div class="card"><span class="muted">今日已打卡</span><span class="kpi">${state.checked.size} / 3 项</span><p class="callout">本页刷新后重置</p></div></div><div style="height:20px"></div><div class="grid"><section class="card"><h2>问清楚 再练习</h2><p>例如：长音后半段不稳定，可以先从哪些方面检查？</p>${btn('开始声乐问答',"go('chat')")}</section><section class="card"><h2>录下一段自己的声音</h2><p>上传短录音，查看报告的组织方式和无法评估时的解释。</p>${btn('进入录音测评',"go('assessment')")}</section></div><div class="notice">四类 Agent：Vocal Knowledge、Song Assessment、Practice Planning、AI Singing。当前闭环：中文问答 → 本人清唱 → 分段报告 → 练习计划；歌声服务后续接入。原型只模拟状态，不计算声音、不连接后端。</div>`;
if(state.page==='chat')s=intro('声乐问答','基于可追溯资料回答；没有证据时应说明资料不足。')+`<section class="card"><label for="question">你想了解什么</label><textarea id="question" placeholder="例如 长音为什么不稳"></textarea><div style="height:12px"></div>${btn('查看演示回答','ask()')} <span class="callout">当前仅演示回答卡片布局</span></section>`+(state.answer?`<section class="card"><span class="pill">Vocal Knowledge · 演示回答</span><h2 style="margin-top:14px">先确认录音条件 再观察变化</h2><p>“不稳定”可能指音高变化，也可能是音量或录音质量变化。可先录一段舒适音域的短音，观察是否在后半段发生变化。若没有可靠测量，本页不会判断生理原因。</p><details><summary>查看来源与证据</summary><p>示例片段 DEMO-CHUNK-01 只用于展示引用交互，非真实声乐文献。</p><p class="muted">正式系统需显示真实 source_id、chunk_id、版本及可核验片段。</p></details><div class="notice">这是固定演示文字，不根据输入生成专业建议，也不提供医疗诊断。</div>${btn('下一步 上传短录音',"go('assessment')")}</section>`:'');
if(state.page==='assessment')s=intro('录音测评','区分无参考声学描述与有参考的音准节奏分析。')+`<div class="grid"><section class="card"><h2>选择录音</h2><label for="analysisLength">测评范围</label><select id="analysisLength"><option value="short">短录音 10 至 120 秒</option><option value="full">全曲 最长 10 分钟</option></select><div class="notice">只接收清唱。分数为研究级练习参考，未经过专业评级校准。</div><label for="audio">短录音文件</label><input id="audio" type="file" accept="audio/*" onchange="selectAudio(this)"><p class="callout">设计上限：短测 10 至 120 秒，文件 100 MiB；本原型不读取内容或校验时长。</p><label class="inline-label"><input id="acappella" type="checkbox"><span>我确认本次是本人清唱（演示）</span></label><label for="taskKind">练习任务类型</label><select id="taskKind"><option value="free_singing">自由演唱</option><option value="long_tone">单一长音任务</option><option value="reference_song">有参考歌曲/片段</option></select><label for="goalDuration">长音目标秒数</label><input id="goalDuration" type="number" min="3" max="120" value="5"><label for="mode">测评模式</label><select id="mode"><option value="none">无参考 仅声学描述</option><option value="reference">有参考 需后端对齐</option></select><label for="assessmentRef">参考 MIDI 或干声</label><input id="assessmentRef" type="file" accept="audio/*,.mid,.midi"><label for="goal">本次目标</label><input id="goal" value="观察长音后半段变化"><div style="height:14px"></div>${btn('模拟提交测评','analyze()')} ${btn('请求取消','cancelJob()',false)}<p class="callout" style="margin-top:12px">文件名 ${escape(state.assessmentFile||'未选择')} · 状态 ${escape(state.job||'尚未提交')}</p></section><section class="card"><h2>如何解读报告</h2><p>无参考时，不展示音准或节奏分。信号质量差或参考对齐覆盖不足时，只呈现可测信息与原因。</p><div class="steps"><span class="step">上传确认</span><span class="step">质量检查</span><span class="step">异步分析</span><span class="step">分段报告</span></div><p class="muted">静音、强伴奏、解码失败、任务超时和取消均需要单独界面状态。</p></section></div>`+(state.report?`<section class="card" style="margin-top:20px"><div class="row spaced"><h2>示例报告</h2><span class="pill">演示数据 · 无真实测量</span></div><table><thead><tr><th>维度</th><th>结果</th><th>说明</th></tr></thead><tbody><tr><td>音高轨迹</td><td>待真实模型提取</td><td>应包含单位和算法版本</td></tr><tr><td>音准偏差</td><td>未评估</td><td>原型没有做参考对齐</td></tr><tr><td>节奏偏差</td><td>未评估</td><td>需要参考和可靠起音对齐</td></tr></tbody></table><div class="notice"><strong>练习参考分 · engineering-v1</strong><p>本演示未计算多维分或综合分，显示“不可用”，不能将空值显示为0分。自由演唱缺参考或任务定义时不提供音准节奏总分。</p><a href="../index.html#doc24">查看多维评分规则与算例</a></div><details><summary>分段建议展示</summary><p>00:10 至 00:18 为演示片段。正式系统应从可测量结果生成建议，不根据此占位时间判断用户表现。</p></details><div style="height:16px"></div>${btn('根据报告建立演示计划','createPlan()')}</section>`:'');
if(state.page==='plan')s=intro('练习计划','每日时间有上限 每项练习都应说明方法和停止条件。')+(state.plan?`<section class="card"><div class="row spaced"><div><span class="pill">7 天 · 每日 15 分钟 · 演示</span><h2 style="margin-top:12px">第 1 天 认识声音的变化</h2></div><span>已完成 ${state.checked.size} / 3 项</span></div>${[['warm','舒适音域热身',3,'轻声开始，避免用力；不适即停'],['steady','短时稳定发声练习',7,'按舒适音高少量重复，不追求极限音域'],['review','录音与复盘',5,'记录感受和录音条件，留给下次对比']].map(([id,t,m,d])=>`<div class="task row spaced"><div><h3>${t} · ${m} 分钟</h3><span class="muted">${d}</span></div>${btn(state.checked.has(id)?'已打卡':'完成打卡',`checkItem('${id}')`,!state.checked.has(id))}</div>`).join('')}<div class="notice">此计划只演示排版与打卡，不能替代个人教学。出现疼痛或持续不适应停止练习。</div></section>`:`<section class="card"><h2>还没有计划</h2><p>可以先完成演示测评，也可以按一般目标建立演示计划。</p>${btn('建立 7 日演示计划','createPlan()')}</section>`);
if(state.page==='singing')s=intro('歌声服务接入','当前仅保留接口，已有服务后续接入。')+`<section class="card"><span class="pill">disabled · 当前未接入</span><h2>本期不开发真实歌声生成</h2><p>四类 Agent 中保留 AI Singing 的能力查询与接入边界。生成、音色训练和 GPU 部署由后续任务接入你已有的实现。</p><p>当前不会创建生成任务、上传音色、产生费用或提供模拟成功音频。</p><details><summary>查看未来接入要求</summary><p>需核对服务协议、SVC/SVS 输入、本人用途授权、撤销机制、版本和产物引用。旋律参考是描述音符高低及时间的模板。</p></details></section>`;
if(state.page==='history')s=intro('曲目与历史','保留参考 模唱 报告 计划之间的关联。')+`<section class="card"><h2>本次原型操作</h2><table><thead><tr><th>项目</th><th>状态</th><th>下一步</th></tr></thead><tbody><tr><td>短录音报告</td><td>${state.report?'已模拟完成':'暂无'}</td><td>${btn('进入测评',"go('assessment')",false)}</td></tr><tr><td>练习计划</td><td>${state.plan?'7 日演示计划':'暂无'}</td><td>${btn('查看计划',"go('plan')",false)}</td></tr><tr><td>歌声生成</td><td>接口预留 · disabled</td><td>${btn('创建参考',"go('singing')",false)}</td></tr></tbody></table><p class="callout">不同录音条件、参考或算法版本的结果不可直接当作同口径成绩趋势。</p></section>`;
if(state.page==='memory')s=intro('记忆与隐私','查看来源 自己确认 随时更正或删除。')+`<section class="card"><h2>练习事实</h2>${state.deleted||state.memory==='deleted'?'<p class="muted">当前没有可用演示事实。</p>':`<span class="pill">${state.memory==='confirmed'?'已确认':'候选 待确认'}</span><p style="margin-top:12px">每天可练习 ${state.memoryMinutes} 分钟</p><p class="callout">来源：演示偏好设置 · L1 事件 → L2 事实 → L3 画像</p><div class="row">${btn('确认事实','confirmMemory()')}${btn('更正为 20 分钟','editMemory()',false)}${btn('删除事实','deleteMemory()',false)}</div>`}</section><section class="card"><h2>声音授权与数据删除</h2><p>授权状态：${state.consent?'演示已同意':'未授权或已撤销'}</p><div class="row">${btn('撤销声音授权','revoke()',false)}<button class="secondary danger" onclick="deleteAll()">清空本次演示数据</button></div><p class="callout" style="margin-top:12px">正式系统立即停止新访问，再显示对象、向量、图谱与派生记忆的异步清理进度。</p></section>`;
if(state.page==='memory')s+=`<section class="card"><h2>用途和保存期限 演示控件</h2><p>各用途独立，不因分析录音自动同意长期记忆或训练。</p><label class="inline-label"><input type="checkbox" id="analysisConsent"><span>允许本次录音分析</span></label><label class="inline-label"><input type="checkbox" id="memoryConsent"><span>允许跨会话练习记忆</span></label><label class="inline-label"><input id="storageConsent" type="checkbox"><span>允许保存练习记录</span></label><label for="rawRetention">原音频保存天数</label><select id="rawRetention"><option>7</option><option selected>30</option><option>90</option><option>180</option></select><label for="reportRetention">报告保存天数</label><select id="reportRetention"><option>7</option><option>30</option><option>90</option><option selected>180</option></select><p class="callout">默认值是本项目工程选择，不是通用标准。原型不提交或持久保存设置。</p></section>`;
if(state.page==='admin')s=intro('管理台','仅展示审核流程 正式系统必须验证管理员权限。')+`<div class="grid"><section class="card"><h2>知识入库检查</h2><label for="sourceTitle">资料标题</label><input id="sourceTitle" placeholder="填写获许可资料名称"><label for="rights">来源与许可说明</label><textarea id="rights" placeholder="登记来源 URI 许可和版本"></textarea><div style="height:12px"></div>${btn('模拟入库校验','ingest()')}<p class="callout" style="margin-top:12px">先清洗 分段 审核 建索引，再激活同一个 corpus_version。</p></section><section class="card"><h2>候选 Skill 审核</h2><span class="pill">状态 ${escape(state.review)}</span><h3 style="margin-top:14px">基础练习计划 0.1.0</h3><p>Critic 通过并不等于已经发布；还需回放测试和人工批准。</p><details><summary>查看审核摘要</summary><p>演示检查：无用户声音路径，无新增工具，适用条件有限。真实回放尚未执行。</p></details><div style="height:14px"></div>${btn('模拟批准发布',"review('published')")}${btn('拒绝',"review('rejected')",false)}</section></div><div class="notice">所有真实评测当前均为 NOT_RUN。截图的命中率与 Token 节省不得用原型状态证明。</div>`;
main.innerHTML=s;document.title=pages.find(x=>x[0]===state.page)[1]+' · DeepVocal 原型';}
function ask(){if(!document.getElementById('question').value.trim())return notify('请先输入一个问题。');state.answer=true;render();notify('已展示固定演示回答，没有调用模型。')}
function selectAudio(el){state.assessmentFile=el.files[0]?.name||null;notify(state.assessmentFile?'已选择文件，仅保留文件名，不读取或上传内容。':'尚未选择文件。')}
function analyze(){if(!state.assessmentFile)return notify('请先选择音频。');if(!document.getElementById('acappella').checked)return notify('请确认本次为本人清唱。');const task=document.getElementById('taskKind').value;const mode=document.getElementById('mode').value;if((task==='reference_song')!==(mode==='reference'))return notify('有参考歌曲任务须选择有参考模式；其他任务使用无参考模式。');if(task==='long_tone'&&!(Number(document.getElementById('goalDuration').value)>=3&&Number(document.getElementById('goalDuration').value)<=120))return notify('长音目标需为3至120秒。');if(!state.assessmentFile)return notify('请先选择音频文件。');if(document.getElementById('mode').value==='reference'&&!document.getElementById('assessmentRef').files.length)return notify('有参考模式需选择参考 MIDI 或干声。');const runId=state.jobVersion=(state.jobVersion||0)+1;state.job='QUEUED';state.report=false;render();notify('模拟排队中，未执行真实声学分析。');setTimeout(()=>{if(state.job==='CANCELLED'||runId!==state.jobVersion)return;state.job='RUNNING';if(state.page==='assessment')render();setTimeout(()=>{if(state.job==='CANCELLED'||runId!==state.jobVersion)return;state.job='SUCCEEDED';state.report=true;if(state.page==='assessment')render();notify('演示报告已完成，所有指标仍为未实际测量。')},450)},450)}
function cancelJob(){if(!['QUEUED','RUNNING'].includes(state.job))return notify('没有正在执行的演示任务。');state.job='CANCELLED';render();notify('演示任务已取消。真实系统需等待 worker 确认。')}
function createPlan(){state.plan=true;go('plan');notify('已建立 7 日演示计划，第 1 天合计 15 分钟。')}
function checkItem(id){state.checked.has(id)?state.checked.delete(id):state.checked.add(id);render();notify('打卡状态已在本次演示中更新。')}
function generate(){return notify('FEATURE_DISABLED：当前只保留歌声接入接口，不创建任务。')}
function revoke(){state.consent=false;state.generated=false;render();notify('演示授权已撤销，不能开始新的生成。')}
function confirmMemory(){state.memory='confirmed';render();notify('事实已确认。正式系统应异步重建 L3。')}
function editMemory(){state.memory='confirmed';state.memoryMinutes=20;render();notify('演示事实已更正为 20 分钟。')}
function deleteMemory(){state.memory='deleted';render();notify('演示事实已删除，正式系统应清理派生画像。')}
function deleteAll(){state.jobVersion=(state.jobVersion||0)+1;state.report=false;state.plan=false;state.checked.clear();state.consent=false;state.generated=false;state.memory='deleted';state.deleted=true;state.answer=false;state.job='';state.assessmentFile=null;render();notify('已清空本次演示的个人数据。未删除任何本地文件。')}
function review(v){state.review=v;render();notify('仅模拟审核状态，真实发布还需权限和回放证据。')}
function ingest(){if(!document.getElementById('sourceTitle').value.trim()||!document.getElementById('rights').value.trim())return notify('资料标题与来源许可都必须填写。');notify('演示校验通过，真实系统需完成分段、证据审核和索引检查才可激活。')}
render();
</script></body></html>
