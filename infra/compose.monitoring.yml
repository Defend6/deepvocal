services:
  prometheus:
    image: prom/prometheus:v3.7.2
    volumes:
      - ../runtime/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../runtime/monitoring/token:/run/secrets/metrics_token:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
volumes:
  prometheus_data:
