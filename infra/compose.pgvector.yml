# Independent vector database; does not replace or migrate the business PostgreSQL volume.
services:
  pgvector:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: deepvocal_vectors
      POSTGRES_USER: deepvocal
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-deepvocal-local-experiment}
    ports: ["127.0.0.1:${PGVECTOR_PORT:-15433}:5432"]
    volumes: ["pgvector_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepvocal -d deepvocal_vectors"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgvector_data:
