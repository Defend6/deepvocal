name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: deepvocal, POSTGRES_USER: deepvocal, POSTGRES_PASSWORD: deepvocal }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U deepvocal" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://deepvocal:deepvocal@127.0.0.1:5432/deepvocal
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://deepvocal:deepvocal@127.0.0.1:5432/deepvocal
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      MODEL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements.lock}
      - run: pip install -r apps/api/requirements.lock -e 'apps/api[dev]'
      - run: python -m alembic -c apps/api/alembic.ini upgrade head
      - run: ruff check apps/api/app apps/api/tests
      - run: python -m pytest -q --basetemp ../../_qa/ci-pytest
        working-directory: apps/api
      - run: python scripts/validate_design_contracts.py --repository-only
      - run: python scripts/check_repository.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
