[project]
name = "deepvocal-api"
version = "0.1.0"
description = "DeepVocal FastAPI and LangGraph orchestration service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "langgraph>=0.2,<1",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "httpx>=0.27,<1",
  "langgraph-checkpoint-postgres>=2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "soundfile>=0.12,<1",
  "neo4j>=5.25,<6",
  "pymilvus>=2.4.10,<2.5",
  "setuptools>=70,<81",
  "PyJWT[crypto]>=2.10,<3",
  "mido>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.ruff]
line-length = 100
